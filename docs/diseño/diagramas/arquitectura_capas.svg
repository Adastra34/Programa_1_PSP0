<text x="164" y="316" font-size="12" fill="#534AB7" dominant-baseline="central">LectorArchivoNumeros · DatosInvalidosException</text>
<text x="164" y="336" font-size="12" fill="#534AB7" dominant-baseline="central">Convierte texto a double con InvariantCulture</text>

<line x1="375" y1="356" x2="375" y2="388" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="140" y="390" width="470" height="100" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
