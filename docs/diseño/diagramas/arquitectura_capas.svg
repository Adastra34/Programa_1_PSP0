<text x="164" y="54" font-size="14" font-weight="bold" fill="#0C447C" dominant-baseline="central">Presentación · Presentacion/</text>
<text x="164" y="76" font-size="12" fill="#185FA5" dominant-baseline="central">ConsolaUI</text>
<text x="164" y="96" font-size="12" fill="#185FA5" dominant-baseline="central">Muestra n, media y desviación (F2) o un error</text>

<line x1="375" y1="116" x2="375" y2="148" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

