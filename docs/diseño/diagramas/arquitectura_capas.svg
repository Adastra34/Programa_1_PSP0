<svg xmlns="http://www.w3.org/2000/svg" width="680" height="550" viewBox="0 0 680 550" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>Arquitectura en capas del Programa 1 PSP0</title>
<desc>Cuatro capas: presentación, aplicación, infraestructura y dominio. Las flechas apuntan hacia el dominio.</desc>
<defs>
