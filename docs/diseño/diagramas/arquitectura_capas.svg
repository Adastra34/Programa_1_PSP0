<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="550" fill="#FFFFFF"/>

<g stroke="#2C2C2A" stroke-width="1.5" fill="none">
<circle cx="60" cy="62" r="10"/>
