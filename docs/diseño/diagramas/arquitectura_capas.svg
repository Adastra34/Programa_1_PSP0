<line x1="44" y1="82" x2="76" y2="82"/>
<line x1="60" y1="98" x2="48" y2="118"/>
<line x1="60" y1="98" x2="72" y2="118"/>
</g>
<text x="60" y="144" font-size="12" fill="#5F5E5A" text-anchor="middle">Usuario</text>
