<text x="164" y="196" font-size="12" fill="#854F0B" dominant-baseline="central">Aplicacion.Ejecutar(args, entrada, salida) → 0 | 1</text>
<text x="164" y="216" font-size="12" fill="#854F0B" dominant-baseline="central">Orquesta el flujo y traduce excepciones a código</text>

